<style>

.cases{position:absolute;left:190px;width:1540px;top:60px;opacity:0;z-index:33;border-radius:26px;padding:30px 44px 28px;background:rgba(18,11,8,.86);border:1px solid rgba(245,167,51,.3);box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 90px rgba(245,167,51,.12)}

.cases.lim .lr b{font-size:28px;font-weight:800;color:#F7F2EA}
.cases.lim .lr span{font-size:24px;font-weight:600;color:#F5A733}
.card .xl{font-size:124px;font-weight:800;letter-spacing:-.04em;line-height:1.08;color:#F7F2EA;white-space:nowrap}

.card .s2{font-size:64px;font-weight:300;letter-spacing:-.02em;color:#EDE6DA;white-space:nowrap}
.card .xl .ch{display:inline-block;will-change:transform,opacity,filter}
#iglow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 55% 42% at 50% 38%,rgba(245,167,51,.22),rgba(245,167,51,.06) 45%,transparent 72%)}
.dust{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;background:#FFD9A0;box-shadow:0 0 10px 2px rgba(245,167,51,.6);opacity:0;pointer-events:none}
.gcount{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:470px;font-weight:900;letter-spacing:-.04em;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(245,167,51,.16);opacity:0;pointer-events:none;white-space:nowrap}

.ring{position:absolute;left:1160px;top:640px;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid rgba(245,167,51,.8);opacity:0;pointer-events:none}
.net{position:absolute;left:0;top:0;opacity:0;pointer-events:none}
.net line{stroke:#F5A733;stroke-width:1.2;stroke-opacity:.28}
.net circle{fill:#E9C48C;opacity:0}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.7);z-index:100;font:14px 'SUIT',sans-serif;color:#ddd;opacity:.15;transition:opacity .3s}
#ui:hover{opacity:1}#ui button{background:#D9B36A;border:0;border-radius:6px;padding:6px 14px;font-weight:800;cursor:pointer;font-family:inherit}#ui input{flex:1}#ui select{background:#2a201b;color:#F5A733;border:1px solid #F5A733;border-radius:6px;padding:5px 8px;font:700 14px SUIT,sans-serif}
</style></head>
<body><div id="stage">

<script>
/* NEXT LAB 「임지연(임팩트 지속관리 연구소)」 v6: 시네마틱 트레일러형.
   원칙: 검은 화면 문구 → 박자에 맞춰 장면이 터짐. 흔들림·입자·빛줄기 없음, 컷은 강박에만, 화면 하나에 한 가지.

var clamp = function (x, a, b) { return Math.max(a == null ? 0 : a, Math.min(b == null ? 1 : b, x)); };
var ease = function (x) { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
var eo = function (x) { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
var lerp = function (a, b, p) { return a + (b - a) * p; };
var $ = function (id) { return document.getElementById(id); };
var shotsEl = $('shots'), layer = $('layer'), flash = $('flash'), grain = $('grain').firstChild;
var flare = $('flare'), BARS = document.querySelectorAll('.bar');
function set(e, k, v) { if (e['_' + k] !== v) { e['_' + k] = v; if (k === 'html') e.innerHTML = v; else e.style[k] = v; } }
var P = '사진_웹/', IMGS = [], SHOTS = [], CARDS = [], LABS = [], NUMS = [], FLASH = [HIT1, DROP];

/* 필름 질감: 한 번 만든 노이즈를 프레임마다 위치만 바꿈 */
(function () { var c = document.createElement('canvas'); c.width = c.height = 256; var x = c.getContext('2d'), d = x.createImageData(256, 256), s = 7;
  for (var i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; var v = s % 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); grain.style.backgroundImage = 'url(' + c.toDataURL() + ')'; })();

/* 사진 컷: a~b 동안 보임(강박에 바로 잘림), 천천히 확대·이동 */
function shot(a, b, src, o) { o = o || {}; var im = document.createElement('img'); im.src = src; if (o.pos) im.style.objectPosition = o.pos; if (o.fit) { im.style.objectFit = o.fit; im.style.background = '#05070d'; } shotsEl.appendChild(im); IMGS.push(im); SHOTS.push({ a: a, b: b, im: im, kb: o.kb || 'in', dim: o.dim == null ? .12 : o.dim, fin: o.fin || .06, grade: o.fit ? false : true }); }
/* 문구 카드: lines = [[html, 클래스]], in: 'fade'(번지듯) | 'cut'(강박에 탁) */
function card(a, b, lines, o) { o = o || {}; var e = document.createElement('div'); e.className = 'card'; e.innerHTML = lines.map(function (l) { return l[1] === 'rule' ? '<div class="rule"></div>' : '<div class="' + l[1] + '">' + l[0] + '</div>'; }).join(''); layer.appendChild(e); CARDS.push({ a: a, b: b, e: e, in: o.in || 'fade', out: o.out == null ? .35 : o.out }); return e; }
function lab(a, b, html, cls) { var e = document.createElement('div'); e.className = cls || 'lab'; e.innerHTML = html; layer.appendChild(e); LABS.push({ a: a, b: b, e: e }); }
function num(a, b, v, dec, unit, label) { var e = card(a, b, [['<span class="n">0</span><span style="font-size:72px;font-weight:600;margin-left:14px">' + unit + '</span>', 'w g'], [label, 's']], { in: 'cut' }); NUMS.push({ a: a, e: e.querySelector('.n'), v: v, dec: dec }); }

/* v8: CRM 화면을 기기처럼 기울여 보여 주는 제품 컷 */
var devEl = $('dev'), DEVS = [];

/* v8: CRM 단계 알약 — 박자마다 하나씩 켜짐 */

var PILLS = ['신청', '심사', '사업관리', '정산', '성과', '사후관리'].map(function (s) { var p = document.createElement('div'); p.className = 'pill'; p.textContent = s; stageBar.appendChild(p); return p; });

var TL = document.createElement('div'); TL.id = 'tl';
TL.innerHTML = '<div class="trk"></div><div class="dash"></div><div class="fil"></div><div class="fil2"></div><div class="end"></div>' + [0, 1, 2, 3].map(function (i) { return '<div class="md" style="left:' + (260 + i * 225) + 'px"></div>'; }).join('') + '<div class="lb" style="left:260px">사업 시작</div><div class="lb e" style="left:1160px">사업 종료</div><div class="lb q" style="left:1660px">사후관리</div>' + [0, 1, 2, 3].map(function () { return '<div class="pp"></div>'; }).join('');
layer.appendChild(TL);
var TLq = function (s) { return TL.querySelector(s); }, TL_F = TLq('.fil'), TL_F2 = TLq('.fil2'), TL_D = TLq('.dash'), TL_E = TLq('.end'), TL_MD = TL.querySelectorAll('.md'), TL_LB = TL.querySelectorAll('.lb'), TL_PP = TL.querySelectorAll('.pp');
